# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin

displayName: Base kit shell improvements

args:
  bash_prompt_pwd_basename:
    default: "false"
    pattern: "^(true|false)$"

capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - description: Install shell improvements
          user: agent
          command: |
            set -exo pipefail

            echo '. /usr/local/share/shell-improvement/git-prompt.sh' | sudo tee -a /etc/bash.bashrc
            echo '. /usr/local/share/shell-improvement/pwd-basename-prompt.sh' | sudo tee -a /etc/bash.bashrc
            echo '. /usr/local/share/shell-improvement/bashrc.sh' | sudo tee -a /etc/bash.bashrc
            sed -i -E 's/^([[:space:]]*)PS1=(.*)$/\1PS1=\2\n\1__install_git_prompt/' ~/.bashrc
            if ${{ kit.args.bash_prompt_pwd_basename }}; then
              sed -i -E 's/^([[:space:]]*)PS1=(.*)$/\1PS1=\2\n\1__install_pwd_basename_prompt/' ~/.bashrc
            fi
        - description: Install GNU Nano improvements
          user: "0"
          command: |
            set -eo pipefail

            set_option()
            {
              local OPTION="$1"
              echo "--> Setting $OPTION"
              if grep -qE "^# set ${OPTION}\$" /etc/nanorc; then
                sed -i "s|^# set ${OPTION}\$|set $OPTION|" /etc/nanorc
              else
                echo "set $OPTION" >> /etc/nanorc
              fi
            }

            # Navigation and editing
            set_option autoindent
            set_option linenumbers
            set_option smarthome

            # Wrapping
            set_option softwrap
            set_option atblanks

            # Interface
            set_option minibar
            set_option constantshow
            set_option indicator

            # Convenience
            set_option historylog
            set_option positionlog

            # Tabs
            echo "--> Setting tabsize 4"
            echo "set tabsize 4" >> /etc/nanorc
